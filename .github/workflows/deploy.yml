name: Deploy Node Application

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  DEPLOYMENT_BUCKET: node-project-artifact
  EC2_INSTANCE_ID: i-02427c9e7ab14357e

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # -----------------------------------------
      # Configure AWS using OIDC
      # -----------------------------------------
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::429502077377:role/GitHubActionsDeployRole
          role-session-name: github-actions-deployment
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------
      # Verify AWS identity
      # -----------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -----------------------------------------
      # Determine release version
      # -----------------------------------------
      - name: Set release version
        run: |
          REVISION=$(git rev-parse --short=12 HEAD)

          if [ -z "$REVISION" ]; then
            echo "Unable to determine Git revision."
            exit 1
          fi

          echo "REVISION=$REVISION" >> "$GITHUB_ENV"

          echo "Release version: $REVISION"

      # -----------------------------------------
      # Package Node application
      # Excluding some Files
      # -----------------------------------------
      - name: Package application
        run: |
          set -e

          rm -f application.zip

          zip -r application.zip . \
            -x ".git/*" \
            -x ".gitignore/*" \
            -x ".github/*" \
            -x "python-health/*" \
            -x "node_modules/*"

          test -s application.zip

          unzip -l application.zip

      # -----------------------------------------
      # Upload versioned artifact to S3
      # -----------------------------------------
      - name: Publish release to S3
        run: |
          set -e

          aws s3 cp application.zip \
            "s3://${DEPLOYMENT_BUCKET}/releases/application-${REVISION}.zip"

          printf '%s' "${REVISION}" > current-version.txt

          aws s3 cp current-version.txt \
            "s3://${DEPLOYMENT_BUCKET}/current-version.txt"

      # -----------------------------------------
      # Trigger deployment using SSM
      # -----------------------------------------
      - name: Deploy with SSM
        run: |
          SSM_COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "commands=[\"sudo /usr/local/bin/deploy-node-app ${REVISION}\"]" \
            --comment "Deploy Node application release ${REVISION}" \
            --query "Command.CommandId" \
            --output text)

          if [ -z "$SSM_COMMAND_ID" ] || [ "$SSM_COMMAND_ID" = "None" ]; then
            echo "SSM did not return a valid command ID."
            exit 1
          fi

          echo "SSM Command ID: $SSM_COMMAND_ID"

          echo "SSM_COMMAND_ID=$SSM_COMMAND_ID" >> "$GITHUB_ENV"

      # -----------------------------------------
      # Get deployment result
      # -----------------------------------------
      - name: Get deployment result
        if: always()
        run: |
          echo "SSM deployment result:"

          aws ssm get-command-invocation \
            --command-id "$SSM_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status: Status,
              ExitCode: ResponseCode,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }' \
            --output json || true

      # -----------------------------------------
      # Fail pipeline if deployment failed
      # -----------------------------------------
      - name: Check deployment status
        run: |
          if [ "$WAIT_STATUS" != "0" ]; then
            echo "Deployment failed on EC2."
            exit 1
          fi

          echo "Deployment completed successfully."

      # -----------------------------------------
      # Cleanup
      # -----------------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -f application.zip current-version.txt
