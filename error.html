<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found">
    <title>404 — Page Not Found</title>
    <style>
        :root { --ink: #27302a; --muted: #6c776f; --green: #3f7249; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7f3;
        }
        main {
            width: min(100%, 460px);
            padding: 42px 32px;
            text-align: center;
            background: rgba(255, 255, 255, .9);
            border: 1px solid rgba(63, 114, 73, .14);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(52, 75, 57, .1);
        }
        .code { color: var(--green); font-size: 4.5rem; font-weight: 800; letter-spacing: -.08em; line-height: 1; }
        h1 { margin: 14px 0 9px; font-size: 1.7rem; letter-spacing: -.03em; }
        p { margin: 0; color: var(--muted); line-height: 1.6; }
        a { display: inline-block; margin-top: 25px; color: var(--green); font-size: .9rem; font-weight: 750; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>Page not found</h1>
        <p>The page you requested does not exist.</p>
        <a href="/">Go back home</a>
    </main>
</body>
</html>
